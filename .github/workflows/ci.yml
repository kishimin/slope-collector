name: CI

on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql+pymysql://db/collector
  UV_FROZEN: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run lint
        run: uv run ruff check .
      - name: Run type checks
        run: uv run mypy app tests

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      TEST_MARKERS: ${{ github.event_name == 'push' && 'small' || github.event_name == 'pull_request' && 'small or medium' || 'small or medium or large' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run push tests
        if: github.event_name == 'push'
        run: uv run pytest -m "$TEST_MARKERS"
      - name: Run tests with coverage
        if: github.event_name != 'push'
        run: >-
          uv run pytest -m "$TEST_MARKERS"
          --cov=app
          --cov-report=term-missing
          --cov-report=xml

  container:
    name: Container
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag slope-collector:ci .

  systemd:
    name: systemd units
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare deployment-shaped paths
        run: |
          sudo groupadd --system slope-collector
          sudo useradd --system --gid slope-collector --no-create-home slope-collector
          sudo install -d -o slope-collector -g slope-collector /opt/slope-collector
          sudo install -d -o root -g slope-collector -m 0750 /etc/slope-collector
          sudo install -m 0640 -o root -g slope-collector /dev/null /etc/slope-collector/collector.env
          sudo install -d /opt/slope-collector/.venv/bin
          sudo install -m 0755 "$(command -v python3)" /opt/slope-collector/.venv/bin/python
      - name: Verify systemd units
        run: >-
          sudo systemd-analyze verify
          deploy/systemd/slope-collector.service
          deploy/systemd/slope-collector-backfill.service
          deploy/systemd/slope-collector.timer
