repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy app tests
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest-small
        name: pytest small
        entry: uv run pytest -m small -q
        language: system
        pass_filenames: false
        stages: [pre-push]
