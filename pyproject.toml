[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "slope-collector"
version = "0.1.0"
description = "Collect and expose normalized public records."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0.100,<1",
    "pydantic-settings>=2,<3",
    "pymysql>=1,<2",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "small: Tests that use one process without network, database, or filesystem access.",
    "medium: Tests that may use localhost, a database, or the filesystem.",
    "large: Tests that may use external systems or remote network access.",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true

